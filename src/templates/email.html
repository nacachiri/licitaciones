<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TenderWatch</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
          <tr>
            <td style="background-color:#1f6feb;padding:20px 28px;">
              <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:700;">TenderWatch</h1>
              <p style="margin:4px 0 0;color:#d6e4ff;font-size:13px;">Licitaciones de la Plataforma de Contratación del Sector Público</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px;">
              <p style="margin:0 0 6px;font-size:14px;color:#52606d;">Resumen del día</p>
              <h2 style="margin:0 0 20px;font-size:24px;color:#102a43;">{{COUNT}} licitación(es) encontrada(s)</h2>
              <p style="margin:0 0 20px;font-size:13px;color:#7b8794;">Fecha de consulta: {{DATE}}</p>

              {{ROWS}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background-color:#f8fafc;border-top:1px solid #e4e7eb;">
              <p style="margin:0;font-size:12px;color:#7b8794;">Generado automáticamente por TenderWatch.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
